  .message.user { align-items: flex-end; }
  .message.ai   { align-items: flex-start; }

  .msg-label {
    font-family: 'Space Mono', monospace;
    font-size: 9px;
    letter-spacing: 0.22em;
    color: var(--text-faint);
    text-transform: uppercase;

  .msg-bubble {
    max-width: 82%;
    line-height: 1.9;
    font-size: 1.05rem;
    font-weight: 300;
  }

  .message.user .msg-bubble {
    color: var(--text-muted);
    text-align: right;
    font-style: italic;

  .message.ai .msg-bubble { color: var(--text); }
  .typing { color: var(--text-ghost); font-style: italic; }

    display: flex;
    flex-direction: column;
    gap: 0.5rem;
    margin: 0.25rem 0 0.25rem 0;

  .spread-title {

    font-size: 8px;
    letter-spacing: 0.2em;
    color: var(--text-faint);
    text-transform: uppercase;

  .cards-row {
    display: flex;
    gap: 0.6rem;
    flex-wrap: wrap;
    align-items: flex-start;
  }

  .card-unit {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }

  .card-pos-label {
    font-family: 'Space Mono', monospace;
    font-size: 7px;
    color: var(--text-faint);
    letter-spacing: 0.08em;
    text-align: center;
    max-width: 58px;
    line-height: 1.4;

  .tarot-card {
    width: 56px;
    height: 90px;
    border: 0.5px solid var(--border-dim);
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    position: relative;
    transition: border-color 0.4s;
  }

  .tarot-card.face-down::after {
    content: '';
    display: block;
    width: 38px;
    height: 62px;
    border: 0.5px solid #222218;
    border-radius: 2px;
  }

  .tarot-card.face-down .card-inner { display: none; }

  .tarot-card.revealed {
    border-color: var(--gold-dim);
    animation: flipIn 0.5s ease forwards;
  }

  .tarot-card.reversed { border-color: var(--purple-dim); }

  @keyframes flipIn {
    0%   { transform: rotateY(90deg); opacity: 0; }
    100% { transform: rotateY(0deg); opacity: 1; }
  }

  .card-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 5px;

    font-size: 8px;

    height: 36px;
  }

  .send-btn:hover { border-color: var(--gold-dim); color: var(--gold); }
  .send-btn:active { transform: scale(0.98); }

<script>

  {name:'宝剑侍从',symbol:'J♠',suit:'swords'},{name:'宝剑骑士',symbol:'Kn♠',suit:'swords'},
  {name:'宝剑王后',symbol:'Q♠',suit:'swords'},{name:'宝剑国王',symbol:'K♠',suit:'swords'},
  {name:'星币Ace',symbol:'A♣',suit:'pentacles'},{name:'星币二',symbol:'2♣',suit:'pentacles'},
  {name:'星币三',symbol:'3♣',suit:'pentacles'},{name:'星币四',symbol:'4♣',suit:'pentacles'},

const SPREADS = {
  default: { label:'指导+三情况', positions:['指导牌','情况一','情况二','情况三'], count:4 },
  cross:   { label:'恋人十字',   positions:['现状','挑战','过去','未来','建议'],    count:5 },
  single:  { label:'单张指引',   positions:['今日指引'],                           count:1 }
};

const SYSTEM = `你是22号的塔罗传讯智能体，代表一个真实占卜师的风格和价值观。

核心特质：
- 说话像真实朋友，不装神弄鬼，不搞玄学腔调
- 开场简短，先让对方说清楚想问什么，聊几句再抽牌
- 会问到点子上，不废话
- 犀利但不残忍，该说的事实会说，知道时机
- 有人文关怀，不滥情不说教
- 平等对待每个人，不仰视也不俯视
- 不被用户几句话带跑，有自己的判断
- 绝不诱导用户往某个方向走

关于抽牌时机：
- 先聊几句，了解用户的问题和状态
- 当你觉得问题聊清楚了，在回复末尾加上 [READY_TO_DRAW] 这个标记
- 加这个标记时，告诉用户心里想着问题，点牌吧
- 不要过早抽牌，至少聊一两轮再说

关于塔罗解读：
- 收到[抽牌结果]时，认真解读每张牌在其位置的含义
- 指导牌：整体情况或对方的整体印象
- 情况牌：具体感受、想法、行动倾向
- 逆位代表能量受阻或内化，解读有所区别
- 结合用户具体问题，不说模糊套话
- 不做绝对预言，说倾向和可能性

对话风格：中文口语，自然，回复不要太长，留白很重要。`;

let messages = [];
let isTyping = false;
let currentSpread = 'default';
let pendingDeck = [];
let selectedCards = [];
let spreadPositions = [];
let pickingCards = false;

function setSpread(type) {
  currentSpread = type;
  document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('btn-' + type).classList.add('active');
}

function shuffleDeck() {
  return [...DECK].sort(() => Math.random() - 0.5).map(c => ({
    ...c, reversed: Math.random() > 0.5
  }));
}

// Show blind-pick card spread in chat
function showBlindPick() {
  if (pickingCards) return;
  pickingCards = true;
  selectedCards = [];
  const sp = SPREADS[currentSpread];
  spreadPositions = sp.positions;
  pendingDeck = shuffleDeck();

  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.id = 'blindPick';
  wrap.style.cssText = 'display:flex;flex-direction:column;gap:0.6rem;margin:0.25rem 0;animation:fadeUp 0.4s ease forwards;opacity:0;';

  const hint = document.createElement('div');
  hint.style.cssText = 'font-family:Space Mono,monospace;font-size:9px;letter-spacing:0.18em;color:#7a7060;text-transform:uppercase;';
  hint.id = 'pickHint';
  hint.textContent = '心里想着问题 · 点选 ' + sp.count + ' 张牌 （已选 0/' + sp.count + '）';
  wrap.appendChild(hint);

  const row = document.createElement('div');
  row.style.cssText = 'display:flex;gap:0.5rem;flex-wrap:wrap;';

  // Show 10 face-down cards to pick from
  for (let i = 0; i < 10; i++) {
    const tc = document.createElement('div');
    tc.className = 'tarot-card face-down';
    tc.style.cursor = 'pointer';
    tc.dataset.idx = i;
    tc.addEventListener('click', () => onCardPick(tc, i, sp.count));
    row.appendChild(tc);
  }

  wrap.appendChild(row);
  area.appendChild(wrap);
  area.scrollTop = area.scrollHeight;
}

function onCardPick(el, deckIdx, total) {
  if (!pickingCards) return;
  if (el.classList.contains('revealed') || el.classList.contains('selected-card')) return;
  if (selectedCards.length >= total) return;

  const card = pendingDeck[deckIdx];
  selectedCards.push(card);

  // Reveal this card
  el.classList.remove('face-down');
  el.classList.add('revealed');
  if (card.reversed) el.classList.add('reversed');
  el.style.cursor = 'default';

  // Build inner
  const inner = document.createElement('div');
  inner.className = 'card-inner';
  const sym = document.createElement('div');
  sym.className = 'card-symbol';
  sym.textContent = card.symbol;
  const nm = document.createElement('div');
  nm.className = 'card-name-sm';
  nm.textContent = card.name;
  const ori = document.createElement('div');
  ori.className = 'card-ori-sm';
  ori.textContent = card.reversed ? '逆位' : '正位';
  inner.appendChild(sym); inner.appendChild(nm); inner.appendChild(ori);
  el.appendChild(inner);

  // Update hint
  const hint = document.getElementById('pickHint');
  if (hint) hint.textContent = '心里想着问题 · 点选 ' + total + ' 张牌 （已选 ' + selectedCards.length + '/' + total + '）';

  if (selectedCards.length === total) {
    pickingCards = false;
    // Label the selected cards with their positions
    setTimeout(() => labelSelectedCards(selectedCards, spreadPositions), 300);
    // Send to AI for reading
    setTimeout(() => sendCardReading(selectedCards, SPREADS[currentSpread]), 800);
  }
}

function labelSelectedCards(cards, positions) {
  // Add position labels below revealed cards
  const area = document.getElementById('chatArea');
  const posRow = document.createElement('div');
  posRow.style.cssText = 'display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.25rem;';
  cards.forEach((c, i) => {
    const lbl = document.createElement('div');
    lbl.style.cssText = 'width:52px;font-family:Space Mono,monospace;font-size:7px;color:#7a7060;text-align:center;letter-spacing:0.06em;';
    lbl.textContent = positions[i] || '';
    posRow.appendChild(lbl);
  });
  const pick = document.getElementById('blindPick');
  if (pick) pick.appendChild(posRow);
}

async function sendCardReading(cards, spread) {
  const desc = cards.map((c, i) =>
    `${spread.positions[i]}：${c.name}（${c.reversed ? '逆位' : '正位'}）`
  ).join('，');
  const cardCtx = `[抽牌结果 - ${spread.label}：${desc}。请解读这个牌阵，结合之前聊到的问题。]`;

  messages.push({ role: 'user', content: cardCtx });
  showTyping();

  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        max_tokens: 1500,
        messages: [
          { role: 'system', content: SYSTEM },
          ...messages
        ]
      })
    });
    const data = await res.json();
    const reply = data.choices?.[0]?.message?.content || '';
    removeTyping();
    messages.push({ role: 'assistant', content: reply });
    addMsg('ai', reply);
  } catch(e) {
    removeTyping();
    addMsg('ai', '网络有点问题，再试一次？');
  }
  isTyping = false;
}

function addMsg(role, text) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.style.animationDelay = '0s';
  const lbl = document.createElement('div');
  lbl.className = 'msg-label';
  lbl.textContent = role === 'user' ? '你' : '22';
  const b = document.createElement('div');
  b.className = 'msg-bubble';
  b.textContent = text;
  div.appendChild(lbl);
  div.appendChild(b);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'message ai';
  div.id = 'typingDot';
  div.style.animationDelay = '0s';
  const lbl = document.createElement('div');
  lbl.className = 'msg-label';
  lbl.textContent = '22';
  const b = document.createElement('div');
  b.className = 'msg-bubble typing';
  b.textContent = '......';
  div.appendChild(lbl); div.appendChild(b);
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const t = document.getElementById('typingDot');
  if (t) t.remove();
}

function quickSend(text) {
  document.getElementById('userInput').value = text;
  sendMessage();
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 96) + 'px';
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

async function sendMessage() {
  if (isTyping || pickingCards) return;

  if (!API_KEY || API_KEY === 'YOUR_API_KEY_HERE') {
    addMsg('ai', '请先填入 API Key。');
    return;
  }

  const input = document.getElementById('userInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  input.style.height = 'auto';
  isTyping = true;

  addMsg('user', text);
  messages.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch('https://api.deepseek.com/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + API_KEY
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        max_tokens: 1000,
        messages: [
          { role: 'system', content: SYSTEM },
          ...messages
        ]
      })
    });

    const data = await res.json();
    let reply = data.choices?.[0]?.message?.content || '';

    const readyToDraw = reply.includes('[READY_TO_DRAW]');
    reply = reply.replace('[READY_TO_DRAW]', '').trim();

    removeTyping();
    messages.push({ role: 'assistant', content: reply });
    addMsg('ai', reply);

    if (readyToDraw) {
      setTimeout(() => showBlindPick(), 600);
    }

  } catch(e) {
    removeTyping();
    addMsg('ai', '网络有点问题，再试一次？');
  }

  isTyping = false;
}
</script>
</body>
